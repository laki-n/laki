{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "laki.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laki.ui.labels" . | nindent 4 }}
  {{- with (include "laki.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.ui.autoscaling.enabled }}
  replicas: {{ .Values.ui.replicaCount }}
  {{- end }}
  {{- with .Values.ui.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "laki.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "laki.ui.selectorLabels" . | nindent 8 }}
        {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.ui.podAnnotations .Values.commonAnnotations }}
      annotations:
        {{- with .Values.ui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- include "laki.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "laki.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.ui.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.ui.terminationGracePeriodSeconds }}
      {{- with .Values.ui.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: laki-ui
          image: {{ include "laki.image" (dict "image" .Values.ui.image "context" $) }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          {{- with .Values.ui.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.ui.containerPort | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            # Next.js inlines NEXT_PUBLIC_* at build time. These are set for
            # server-side rendering and for images rebuilt with matching build
            # arguments; see the chart README for the full explanation.
            - name: NEXT_PUBLIC_API_BASE
              value: {{ include "laki.ui.apiBase" . | quote }}
            - name: NEXT_PUBLIC_API_URL
              value: {{ include "laki.ui.apiBase" . | quote }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.ui.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.ui.customLivenessProbe }}
          livenessProbe:
            {{- toYaml .Values.ui.customLivenessProbe | nindent 12 }}
          {{- else if .Values.ui.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.ui.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.ui.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.ui.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.ui.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.ui.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.ui.customReadinessProbe }}
          readinessProbe:
            {{- toYaml .Values.ui.customReadinessProbe | nindent 12 }}
          {{- else if .Values.ui.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.ui.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.ui.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.ui.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.ui.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.ui.readinessProbe.successThreshold }}
          {{- end }}
          {{- with .Values.ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with .Values.ui.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.ui.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
