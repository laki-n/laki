{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "laki.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laki.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- include "laki.imagePullSecrets" . | nindent 2 }}
  containers:
    - name: healthz
      image: {{ include "laki.image" (dict "image" .Values.tests.image "context" $) }}
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      command:
        - curl
      args:
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "10"
        - {{ printf "%s/healthz" (include "laki.backend.internalUrl" .) }}
{{- end }}
