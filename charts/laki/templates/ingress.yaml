{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.enabled is true but ingress.host is empty - set ingress.host to the hostname that should serve Laki" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "laki.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laki.labels" . | nindent 4 }}
  {{- $annotations := merge (dict) .Values.ingress.annotations .Values.commonAnnotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range .Values.ingress.apiPaths }}
          - path: {{ . }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "laki.backend.fullname" $ }}
                port:
                  number: {{ $.Values.backend.service.httpPort }}
          {{- end }}
          {{- if .Values.ui.enabled }}
          - path: {{ .Values.ingress.uiPath }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "laki.ui.fullname" . }}
                port:
                  number: {{ .Values.ui.service.port }}
          {{- end }}
    {{- with .Values.ingress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
