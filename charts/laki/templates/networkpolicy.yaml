{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "laki.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laki.backend.labels" . | nindent 4 }}
  {{- with (include "laki.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "laki.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.backend.containerPort }}
          protocol: TCP
        - port: {{ .Values.backend.grpcContainerPort }}
          protocol: TCP
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        # The dashboard and any other pod in this release.
        - podSelector:
            matchLabels:
              {{- include "laki.selectorLabels" . | nindent 14 }}
        {{- range .Values.networkPolicy.ingressNamespaceSelectors }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- range .Values.networkPolicy.ingressPodSelectors }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- end }}
{{- end }}
