{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "laki.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laki.ui.labels" . | nindent 4 }}
  {{- $annotations := merge (dict) .Values.ui.service.annotations .Values.commonAnnotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.ui.service.type "NodePort") .Values.ui.service.nodePort }}
      nodePort: {{ .Values.ui.service.nodePort }}
      {{- end }}
  selector:
    {{- include "laki.ui.selectorLabels" . | nindent 4 }}
{{- end }}
