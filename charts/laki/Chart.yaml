apiVersion: v2
name: laki
description: Multi-tenant notification engine for Email, SMS, Push, WhatsApp, Slack and Webhooks, with an optional operations dashboard.
type: application

# Chart version. Bump this on every chart change - chart-releaser publishes a
# new release only when this value changes.
version: 1.9.0

# Version of the Laki backend/UI images this chart deploys by default.
appVersion: "v1.5.0"

home: https://github.com/laki-n/laki
icon: https://raw.githubusercontent.com/laki-n/laki/main/charts/laki/icon.svg
sources:
  - https://github.com/laki-n/laki

keywords:
  - notification
  - notifications
  - messaging
  - email
  - sms
  - push
  - whatsapp
  - slack
  - webhook
  - multi-tenant
  - golang

maintainers:
  - name: KaleabArgaw
    url: https://github.com/KaleabArgaw
  - name: abduselamm
    url: https://github.com/abduselamm

kubeVersion: ">=1.21.0-0"

annotations:
  artifacthub.io/category: streaming-messaging
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/laki-n/laki
    - name: Backend image
      url: https://github.com/orgs/laki-n/packages/container/package/laki
    - name: Dashboard image
      url: https://github.com/orgs/laki-n/packages/container/package/laki-ui
  artifacthub.io/images: |
    - name: laki
      image: ghcr.io/laki-n/laki:v1.5.0
      whitelisted: false
    - name: laki-ui
      image: ghcr.io/laki-n/laki-ui:v1.5.0
      whitelisted: false
  artifacthub.io/changes: |
    - kind: changed
      description: laki-n/laki released v1.5.0 (was v1.4.0)
    - kind: changed
      description: laki-n/laki-ui released v1.5.0 (was v1.4.0)
