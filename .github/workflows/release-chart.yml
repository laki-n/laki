name: Release Helm Chart

# Packages every chart under charts/ whose version in Chart.yaml has changed,
# attaches the .tgz to a GitHub release, and publishes the Helm repository index
# to the gh-pages branch. Artifact Hub polls that index for new versions.
#
# One-time setup, see RELEASING.md:
#   1. create an empty, orphan `gh-pages` branch
#   2. Settings > Pages > Source: "Deploy from a branch" -> gh-pages / root
#   3. fill in artifacthub-repo.yml
#   4. add https://laki-n.github.io/laki as a Helm repository on artifacthub.io

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'artifacthub-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-chart
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # Signing is driven by .cr.yaml, which chart-releaser reads when packaging.
      # The key material lives only in this job, at the paths that file names.
      - name: Provide the signing key
        env:
          KEYRING_BASE64: ${{ secrets.GPG_KEYRING_BASE64 }}
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${KEYRING_BASE64:-}" ] || [ -z "${PASSPHRASE:-}" ]; then
            echo "::error::Signing secrets are missing - refusing to publish unsigned charts."
            exit 1
          fi
          mkdir -p .cr-signing && chmod 700 .cr-signing
          printf '%s' "$KEYRING_BASE64" | base64 -d > .cr-signing/secring.gpg
          printf '%s' "$PASSPHRASE" > .cr-signing/passphrase
          chmod 600 .cr-signing/*

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          config: .cr.yaml
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Destroy the signing key
        if: always()
        run: |
          shred -u .cr-signing/* 2>/dev/null || true
          rm -rf .cr-signing

      - name: Confirm the published release is signed
        run: |
          set -euo pipefail
          version=$(grep -E '^version:' charts/laki/Chart.yaml | awk '{print $2}')
          tag="laki-${version}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No release $tag - nothing was published this run."
            exit 0
          fi
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets"
          if ! echo "$assets" | grep -q '\.tgz\.prov$'; then
            echo "::error::$tag has no .prov asset - it published unsigned."
            exit 1
          fi
          echo "$tag is signed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Artifact Hub repository metadata
        if: always()
        run: |
          set -euo pipefail
          # artifacthub-repo.yml earns the verified-publisher badge; KEYS lets
          # consumers verify the provenance files with `helm verify`. Both have
          # to be served from the repository root, next to index.yaml.
          files="artifacthub-repo.yml KEYS"

          # chart-releaser just pushed gh-pages; pick up the ref it wrote.
          if ! git fetch --depth=1 origin gh-pages; then
            echo "No gh-pages branch yet; skipping. Create it and re-run."
            exit 0
          fi

          # Detached worktree so this never disturbs the checked-out branch.
          workdir="$(mktemp -d)"
          git worktree add --detach "$workdir" FETCH_HEAD

          copied=""
          for src in $files; do
            if [ -f "$src" ]; then
              cp "$src" "$workdir/$src"
              copied="$copied $src"
            else
              echo "No $src to publish; skipping it."
            fi
          done
          [ -n "$copied" ] || exit 0

          cd "$workdir"
          # Stage before comparing: `git diff` ignores untracked files, so on the
          # first run it would report "no change" and silently skip the push.
          git add $copied
          if git diff --cached --quiet -- $copied; then
            echo "Repository metadata already up to date."
          else
            git commit -m "Update repository metadata"
            git push origin HEAD:gh-pages
            echo "Published to gh-pages:$copied"
          fi
