name: Watch Laki Images

# Keeps the chart in step with the images published from the Laki backend and
# dashboard repositories, which are private and cannot notify this repository
# directly. Instead of a webhook, this polls Docker Hub - which is public - for
# both repositories and opens a pull request when something moved:
#
#   * a newer vX.Y.Z tag appeared         -> minor chart bump, appVersion moves
#   * the pinned tag was rebuilt in place -> patch chart bump, appVersion stays
#
# The second case matters: security rebuilds are pushed onto the existing tag,
# so the digest is the only evidence anything changed, and a chart bump is what
# makes Artifact Hub re-run its security scan against the new image.
#
# Merging the pull request triggers release-chart.yml, which publishes to
# Artifact Hub. Nothing is released without review.

on:
  schedule:
    # Every six hours, at a minute unlikely to collide with peak Actions load.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: watch-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BRANCH: chore/sync-images
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compare the chart against the published images
        id: sync
        run: python .github/scripts/sync_images.py

      - name: Set up Helm
        if: steps.sync.outputs.changed == 'true'
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Validate the updated chart
        if: steps.sync.outputs.changed == 'true'
        run: |
          helm lint --strict charts/laki
          helm template check charts/laki > /dev/null
          helm template check charts/laki -f charts/laki/ci/full-values.yaml > /dev/null

      - name: Push the update to a branch
        if: steps.sync.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One reused branch, rebuilt from main each time, so repeated
          # detections replace the proposal instead of stacking commits.
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Sync chart with published Laki images" -m "$SUMMARY"
          git push --force origin "$BRANCH"

      - name: Open or refresh the pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEEDED: ${{ steps.sync.outputs.seeded }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
          MOVED: ${{ steps.sync.outputs.body }}
          CHART_VERSION: ${{ steps.sync.outputs.chart_version }}
          APP_VERSION: ${{ steps.sync.outputs.app_version }}
          BUMP: ${{ steps.sync.outputs.bump }}
        run: |
          set -uo pipefail

          if [ "$SEEDED" = "true" ]; then
            title="Seed the published image baseline"
            moved="Nothing yet — this records the currently published digests so future rebuilds can be detected. No chart change is included."
            detail=""
          else
            title="Sync chart with published Laki images ($SUMMARY)"
            moved="$MOVED"
            detail="Chart version bumped to \`$CHART_VERSION\` ($BUMP); \`appVersion\` is now \`$APP_VERSION\`."
          fi

          body=$(cat <<EOF
          Opened automatically by [\`watch-images.yml\`](.github/workflows/watch-images.yml)
          after comparing \`charts/laki/Chart.yaml\` against the tags and digests
          published on Docker Hub.

          **What moved**

          $moved

          $detail

          \`helm lint --strict\` and a full-values render passed before this was opened.

          Merging triggers \`release-chart.yml\`, which packages the chart and
          publishes it to Artifact Hub.
          EOF
          )

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
            echo "Refreshed the existing pull request."
            exit 0
          fi

          if gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"; then
            exit 0
          fi

          # Organisation policy can forbid Actions from opening pull requests.
          # The branch is already pushed, so leave a trail rather than failing
          # silently - otherwise this workflow looks healthy while doing nothing.
          echo "::warning::Could not open a pull request; filing an issue instead."
          gh issue create \
            --title "$title" \
            --label automated \
            --body "$(printf '%s\n\n%s\n' "$body" "GitHub Actions could not open the pull request automatically, most likely because the organisation disallows it (Settings → Actions → *Allow GitHub Actions to create and approve pull requests*). The branch \`$BRANCH\` is pushed and ready — open the pull request here: https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1")"
