name: Watch Laki Images

# Keeps the chart in step with the images published from the Laki backend and
# dashboard repositories, which are private and cannot notify this repository
# directly. Instead of a webhook, this polls Docker Hub - which is public - for
# both repositories and commits a chart bump when something moved:
#
#   * a newer vX.Y.Z tag appeared         -> minor chart bump, appVersion moves
#   * the pinned tag was rebuilt in place -> patch chart bump, appVersion stays
#
# The second case is the whole point. Upstream ships security fixes by rebuilding
# an existing tag, so the digest is the only evidence anything changed. Artifact
# Hub only re-scans a chart when a new chart version is published, so without
# this the security report keeps describing images that were replaced weeks ago.
#
# It commits straight to main, which triggers release-chart.yml and publishes to
# Artifact Hub unattended. That is deliberate: the organisation forbids Actions
# from opening pull requests, so a review step here would simply never run. Every
# change is machine-generated from the published digests, lint-checked before it
# lands, and revertable like any other commit.

on:
  schedule:
    # Every six hours, at a minute unlikely to collide with peak Actions load.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch release-chart.yml: a push made with GITHUB_TOKEN does
  # not trigger other workflows, so the release has to be asked for explicitly.
  actions: write

concurrency:
  group: watch-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compare the chart against the published images
        id: sync
        run: python .github/scripts/sync_images.py

      - name: Set up Helm
        if: steps.sync.outputs.changed == 'true'
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Validate the updated chart
        if: steps.sync.outputs.changed == 'true'
        run: |
          helm lint --strict charts/laki
          helm template check charts/laki > /dev/null
          helm template check charts/laki -f charts/laki/ci/full-values.yaml > /dev/null

      - name: Commit and push to main
        if: steps.sync.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync chart with published Laki images" -m "$SUMMARY"
          # Another commit may have landed while this job ran; rebase rather
          # than force, so a concurrent chart change is never discarded.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "Pushed: $SUMMARY"

      - name: Trigger the release
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub suppresses workflow triggers for pushes authenticated with
          # GITHUB_TOKEN, to stop workflows re-triggering themselves. Without
          # this call the bump lands on main and is never packaged, leaving the
          # chart version in git but absent from Artifact Hub.
          gh workflow run release-chart.yml --ref main
          echo "Requested a chart release."

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Image watch"
            echo
            if [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
              echo "Published chart \`${{ steps.sync.outputs.chart_version }}\` (${{ steps.sync.outputs.bump }} bump)."
              echo
              echo "${{ steps.sync.outputs.body }}"
              echo
              echo "Artifact Hub re-scans the images on its next pass."
            else
              echo "No image change since the last sync."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
